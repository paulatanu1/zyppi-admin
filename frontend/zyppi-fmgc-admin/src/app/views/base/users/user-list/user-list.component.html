<c-row>
  <c-col xs="12">
    <c-card class="mb-4">
      <c-card-header><strong>Users</strong></c-card-header>
      <c-card-body>
        @if (error()) {
          <p class="text-danger">{{ error() }}</p>
        }
        @if (loading()) {
          <p class="text-body-secondary">Loading…</p>
        } @else {
          <table cTable hover>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Joined</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              @for (user of users(); track user.id) {
                <tr>
                  <td>{{ user.full_name ?? '—' }}</td>
                  <td>{{ user.email ?? '—' }}</td>
                  <td>{{ user.phone ?? '—' }}</td>
                  <td>{{ user.created_at | date: 'mediumDate' }}</td>
                  <td class="text-end">
                    <a [routerLink]="['/base/users', user.id]">View</a>
                  </td>
                </tr>
              } @empty {
                <tr><td colspan="5" class="text-body-secondary">No users yet.</td></tr>
              }
            </tbody>
          </table>
        }
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
